server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /games/find-aemeath/;
    }

    location = /games/find-aemeath/index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /games/find-aemeath/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /games/find-aemeath/ {
        try_files $uri $uri/ /games/find-aemeath/index.html;
    }
}
