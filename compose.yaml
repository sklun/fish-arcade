name: fish-arcade

# Set FISH_SOURCE_DIR when this file is used from a stack directory outside the
# repository. The default keeps local Compose validation relative to this file.
services:
  web:
    container_name: fish-web
    build:
      context: ${FISH_SOURCE_DIR:-.}
      dockerfile: web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      arrow:
        condition: service_healthy
      find-aemeath:
        condition: service_healthy
    restart: unless-stopped

  arrow:
    container_name: fish_arrow
    build:
      context: ${FISH_SOURCE_DIR:-.}/arrow
    expose:
      - "80"
    restart: unless-stopped

  find-aemeath:
    container_name: fish_find_aemeath
    build:
      context: ${FISH_SOURCE_DIR:-.}/find-aemeath
    expose:
      - "80"
    restart: unless-stopped
